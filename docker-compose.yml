version: '3.8'
services:
  db:
    image: postgres:15
    container_name: postgres_container
    restart: unless-stopped
    environment:
      POSTGRES_USER: zi
      POSTGRES_PASSWORD: zi
      POSTGRES_DB: trade_journal_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
